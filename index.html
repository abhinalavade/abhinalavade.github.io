<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Info - app-ads.txt</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding-top: 50px; background-color: #f4f4f9; }
        .container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 80%; max-width: 600px; text-align: center; }
        button { background-color: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 1rem; margin-bottom: 20px; }
        button:hover { background-color: #0056b3; }
        pre { text-align: left; background: #eee; padding: 1rem; border-radius: 4px; overflow-x: auto; display: none; white-space: pre-wrap; word-wrap: break-word; }
    </style>
</head>
<body>
    <div class="container">
        <h1>App Developer Website</h1>
        <p>Click below to verify the authorized digital sellers for our applications.</p>
        <button onclick="toggleAds()">View app-ads.txt Content</button>
        <pre id="adsContent">Fetching data...</pre>
    </div>

    <script>
        async function toggleAds() {
            const pre = document.getElementById('adsContent');
            // Toggle visibility
            if (pre.style.display === 'block') {
                pre.style.display = 'none';
                return;
            }
            
            try {
                // Fetches app-ads.txt from the same root directory
                const response = await fetch('app-ads.txt');
                if (response.ok) {
                    const text = await response.text();
                    pre.textContent = text;
                    pre.style.display = 'block';
                } else {
                    pre.textContent = 'Error: app-ads.txt file not found in root.';
                    pre.style.display = 'block';
                }
            } catch (err) {
                pre.textContent = 'Error loading file. Ensure it is hosted on the same domain.';
                pre.style.display = 'block';
            }
        }
    </script>
</body>
</html>
